[package]
name = "hark"
version = "0.1.0"
description = "Hark - local-only, open-source meeting recorder with private AI"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "hark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
cuda = ["hark-asr/cuda", "hark-llm/cuda"]
metal = ["hark-asr/metal", "hark-llm/metal"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi"] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-log = "2.9"
tauri-plugin-single-instance = "2.4"
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-dialog = "2.7"
tauri-plugin-opener = "2.5"
tauri-plugin-notification = "2.4"
tauri-plugin-os = "2.3"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
hark-store = { path = "../crates/hark-store" }
hark-detect = { path = "../crates/hark-detect" }
hark-capture = { path = "../crates/hark-capture" }
hark-models = { path = "../crates/hark-models" }
hark-asr = { path = "../crates/hark-asr" }
hark-diarize = { path = "../crates/hark-diarize" }
hark-llm = { path = "../crates/hark-llm" }
hark-share = { path = "../crates/hark-share" }
hark-calendar = { path = "../crates/hark-calendar" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
chrono.workspace = true
log = "0.4"
tracing = "0.1"
tracing-log = "0.2"
hound = "3.5"
uuid.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
