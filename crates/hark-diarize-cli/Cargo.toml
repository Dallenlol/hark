[package]
name = "hark-diarize-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Sidecar: speaker diarization + voiceprints via sherpa-onnx (WAV in, JSON out)"

[[bin]]
name = "hark-diarize"
path = "src/main.rs"

[dependencies]
sherpa-rs = { version = "0.6", default-features = false, features = ["download-binaries"] }
hark-diarize = { path = "../hark-diarize" }
hound = "3.5"
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
