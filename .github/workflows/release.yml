name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64-cpu
            os: windows-latest
            features: ""
            suffix: cpu
          - name: windows-x64-cuda
            os: windows-latest
            features: cuda
            suffix: cuda
          - name: macos-arm64
            os: macos-14
            features: metal
            suffix: apple-silicon
          - name: macos-x64
            os: macos-14
            target: x86_64-apple-darwin
            features: ""
            suffix: intel
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          # ggml-v2: whisper-rs-sys does not re-run its build script when the GGML_* env
          # (in .cargo/config.toml) changes, so bump this suffix whenever those flags move.
          key: ${{ matrix.name }}-ggml-v2
          # sherpa-rs downloads prebuilt binaries here; cache them with the build-script output that references them.
          cache-directories: |
            ~/.cache/sherpa-rs
            ~/Library/Caches/sherpa-rs
            ~/AppData/Local/sherpa-rs
            ~/.cache/hark
      - name: Install LLVM (bindgen)
        if: runner.os == 'Windows'
        run: choco install -y llvm
      - name: Install CUDA toolkit
        if: matrix.features == 'cuda'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "13.2.2"
          method: network
          sub-packages: '["nvcc", "crt", "nvvm", "cudart", "cublas", "cublas_dev", "thrust", "visual_studio_integration"]'
      - name: Register CUDA with Visual Studio's MSBuild
        if: matrix.features == 'cuda'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $src = Join-Path $env:CUDA_PATH "extras\visual_studio_integration\MSBuildExtensions"
          Get-ChildItem -Path (Join-Path $vs "MSBuild\Microsoft\VC") -Directory | ForEach-Object {
            $dst = Join-Path $_.FullName "BuildCustomizations"
            if (Test-Path $dst) { Copy-Item "$src\*" $dst -Force; Write-Host "CUDA build customizations -> $dst" }
          }
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Prepare sidecars and runtime libraries
        env:
          # Cross-building Intel from Apple Silicon: keep the arm64 Homebrew OpenSSL out of llama.cpp's link.
          CMAKE_DISABLE_FIND_PACKAGE_OpenSSL: ${{ matrix.target && 'TRUE' || '' }}
        run: node scripts/prepare-bundle.mjs --features "${{ matrix.features }}" ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        # To sign and notarize macOS builds, add APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
        # APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID as repository secrets
        # and pass them through here (tauri-action treats an empty value as a broken certificate).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CMAKE_DISABLE_FIND_PACKAGE_OpenSSL: ${{ matrix.target && 'TRUE' || '' }}
          # Updater artifacts (.sig) are only produced when the signing key is present.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          HARK_VARIANT: ${{ matrix.suffix == 'apple-silicon' && 'metal' || matrix.suffix == 'intel' && 'metal' || matrix.suffix }}
        with:
          args: ${{ matrix.features != '' && format('--features {0}', matrix.features) || '' }} ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      - name: Collect installers with variant suffix
        shell: bash
        run: |
          shopt -s nullglob
          mkdir -p dist
          find target -path '*/bundle/*' -maxdepth 5 \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.sig' -o -name '*.tar.gz' \) -print
          for f in target/release/bundle/nsis/*.exe target/release/bundle/nsis/*.exe.sig target/release/bundle/msi/*.msi \
                   target/release/bundle/dmg/*.dmg target/*/release/bundle/dmg/*.dmg \
                   target/release/bundle/macos/*.app.tar.gz target/release/bundle/macos/*.app.tar.gz.sig \
                   target/*/release/bundle/macos/*.app.tar.gz target/*/release/bundle/macos/*.app.tar.gz.sig; do
            base=$(basename "$f")
            case "$base" in
              *.app.tar.gz.sig) stem="${base%.app.tar.gz.sig}"; ext="app.tar.gz.sig" ;;
              *.app.tar.gz)     stem="${base%.app.tar.gz}";     ext="app.tar.gz" ;;
              *.exe.sig)        stem="${base%.exe.sig}";        ext="exe.sig" ;;
              *)                stem="${base%.*}";              ext="${base##*.}" ;;
            esac
            cp "$f" "dist/${stem}-${{ matrix.suffix }}.${ext}"
          done
          (cd dist && (command -v sha256sum >/dev/null && sha256sum * || shasum -a 256 *) > "SHA256SUMS-${{ matrix.name }}.txt" && cat "SHA256SUMS-${{ matrix.name }}.txt")
      - name: Upload to the GitHub release (draft)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || gh release create "${{ github.ref_name }}" --draft --title "Hark ${{ github.ref_name }}" --notes "See CHANGELOG.md."
          gh release upload "${{ github.ref_name }}" dist/* --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: hark-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  manifests:
    name: update manifests
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all
          merge-multiple: true
      - name: Write latest.json
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -la all
          ver="${TAG#v}"
          base="https://github.com/${REPO}/releases/download/${TAG}"
          platforms="{}"
          add() { # <platform-key> <asset>
            [ -f "all/$2" ] || { echo "missing $2 for $1"; return 0; }
            [ -f "all/$2.sig" ] || { echo "missing signature for $2 (TAURI_SIGNING_PRIVATE_KEY secret unset?)"; return 0; }
            platforms=$(jq --arg k "$1" --arg u "$base/$2" --arg s "$(cat "all/$2.sig")" '. + {($k): {url: $u, signature: $s}}' <<<"$platforms")
          }
          add windows-x86_64-cpu  "Hark_${ver}_x64-setup-cpu.exe"
          add windows-x86_64-cuda "Hark_${ver}_x64-setup-cuda.exe"
          add darwin-aarch64      "Hark-apple-silicon.app.tar.gz"
          add darwin-x86_64       "Hark-intel.app.tar.gz"
          mkdir -p out
          jq -n --arg v "$ver" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson p "$platforms"             '{version: $v, notes: "See CHANGELOG.md", pub_date: $d, platforms: $p}' > out/latest.json
          cat out/latest.json
      - name: Upload manifests to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" out/* --clobber --repo "${{ github.repository }}"
