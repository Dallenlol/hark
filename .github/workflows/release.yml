name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64-cpu
            os: windows-latest
            features: ""
            suffix: cpu
          - name: windows-x64-cuda
            os: windows-latest
            features: cuda
            suffix: cuda
          - name: macos-arm64
            os: macos-14
            features: metal
            suffix: apple-silicon
          - name: macos-x64
            os: macos-13
            features: ""
            suffix: intel
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: Install LLVM (bindgen)
        if: runner.os == 'Windows'
        run: choco install -y llvm
      - name: Install CUDA toolkit
        if: matrix.features == 'cuda'
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: "12.6.0"
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "visual_studio_integration"]'
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Prepare sidecars and runtime libraries
        run: node scripts/prepare-bundle.mjs --features "${{ matrix.features }}"
      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Hark ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG.md. Windows: pick the CUDA installer if you have an NVIDIA GPU, otherwise CPU. macOS: Apple Silicon or Intel."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.features != '' && format('--features {0}', matrix.features) || '' }}
      - name: Rename artifacts with variant suffix
        shell: bash
        run: |
          shopt -s nullglob
          for f in src-tauri/target/release/bundle/nsis/*.exe src-tauri/target/release/bundle/msi/*.msi target/release/bundle/nsis/*.exe target/release/bundle/msi/*.msi target/release/bundle/dmg/*.dmg src-tauri/target/release/bundle/dmg/*.dmg; do
            base=$(basename "$f"); ext="${base##*.}"; stem="${base%.*}"
            cp "$f" "${stem}-${{ matrix.suffix }}.${ext}"
          done
          ls -la *.exe *.msi *.dmg 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: hark-${{ matrix.name }}
          path: |
            *.exe
            *.msi
            *.dmg
          if-no-files-found: warn
