name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: |
            ~/.cache/sherpa-rs
            ~/Library/Caches/sherpa-rs
            ~/AppData/Local/sherpa-rs
      - name: Install LLVM (bindgen)
        if: runner.os == 'Windows'
        run: choco install -y llvm
      - name: Frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build
      - name: Rust tests
        run: cargo test --workspace --exclude hark
      - name: Clippy
        run: cargo clippy --workspace --exclude hark --all-targets -- -D warnings
      - name: App compiles
        shell: bash
        run: |
          # tauri-build needs the sidecar files to exist; empty placeholders are enough for a type-check.
          triple=$(rustc -vV | sed -n 's/host: //p')
          ext=""; [[ "$RUNNER_OS" == "Windows" ]] && ext=".exe"
          mkdir -p src-tauri/binaries
          touch "src-tauri/binaries/ffmpeg-${triple}${ext}" "src-tauri/binaries/hark-diarize-${triple}${ext}"
          cargo check -p hark
