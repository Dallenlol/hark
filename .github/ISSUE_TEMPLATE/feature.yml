name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: What are you trying to do? }
    validations: { required: true }
  - type: textarea
    id: idea
    attributes: { label: How would you like it to work? }
  - type: checkboxes
    id: principles
    attributes:
      label: Fits the principles
      options:
        - label: It stays local-only and needs a user click for anything side-effectful.
